<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page Not Found — Genkō Docs</title>
  <meta name="robots" content="noindex">
  <meta http-equiv="refresh" content="0; url=https://getgenko.com/docs">
  <link rel="canonical" href="https://getgenko.com/docs">
  <script>
    window.location.replace('https://getgenko.com/docs');
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #f8fafc;
      color: #1e293b;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 4px 24px rgba(0,0,0,.08);
      padding: 48px 40px;
      max-width: 520px;
      width: 100%;
      text-align: center;
    }
    .icon { font-size: 56px; margin-bottom: 16px; }
    h1 { font-size: 22px; font-weight: 700; margin-bottom: 8px; color: #0f172a; }
    p { font-size: 15px; color: #475569; line-height: 1.6; margin-bottom: 12px; }
    .new-url {
      display: inline-block;
      background: #eff6ff;
      border: 1px solid #bfdbfe;
      border-radius: 6px;
      padding: 6px 14px;
      font-size: 14px;
      font-weight: 600;
      color: #2563eb;
      margin: 8px 0 20px;
      word-break: break-all;
    }
    .btn {
      display: inline-block;
      background: #2563eb;
      color: #fff;
      text-decoration: none;
      padding: 11px 28px;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      transition: background .15s;
    }
    .btn:hover { background: #1d4ed8; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">&#128218;</div>
    <h1>These docs have moved</h1>
    <p>The Genkō documentation has a new home. If you are not redirected automatically, use:</p>
    <a class="new-url" href="https://getgenko.com/docs">getgenko.com/docs</a>
    <br>
    <a class="btn" href="https://getgenko.com/docs">Go to the new docs &rarr;</a>
  </div>
</body>
</html>
