title: Genkō Docs
description: >-
  Maintained Jekyll mirror of the current Genkō documentation. The canonical
  docs live at getgenko.com/docs.
remote_theme: just-the-docs/just-the-docs

color_scheme: light
logo: false

aux_links:
  "Canonical docs →":
    - "https://getgenko.com/docs"

aux_links_new_tab: true

footer_content: "Genkō Healthcare Platform &copy; 2026"

search_enabled: true
search:
  heading_level: 2
  previews: 3
  preview_words_before: 5
  preview_words_after: 10
  tokenizer_separator: /[\s/]+/

nav_enabled: true

back_to_top: true
back_to_top_text: "Back to top"

callouts_level: quiet
callouts:
  highlight:
    color: yellow
  important:
    title: Important
    color: blue
  new:
    title: New
    color: green
  note:
    title: Note
    color: purple
  warning:
    title: Warning
    color: red

exclude:
  - .git
  - .github
  - .gitignore
  - .bundle
  - node_modules
  - vendor
  - "*.gem"
  - "*.gemspec"
  - Gemfile
  - Gemfile.lock
  - DEPLOYMENT.md
  - backup-jekyll
  - blog
  - docs
  - src
  - static
  - docusaurus.config.ts
  - package.json
  - sidebars.ts
  - tsconfig.json

markdown: kramdown
kramdown:
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    block:
      line_numbers: false

plugins:
  - jekyll-remote-theme
  - jekyll-seo-tag
