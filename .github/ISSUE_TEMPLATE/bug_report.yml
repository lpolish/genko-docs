name: Bug report — getgenko.com
description: Report something that is broken or not working as expected in the Genkō application.
title: "[Bug] "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please fill in as much detail as you can so the team can reproduce and fix it quickly.

  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: A clear description of the bug.
      placeholder: "Example: When I click 'Save' on the appointment form, nothing happens and no error is shown."
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
      placeholder: "Example: The appointment should be saved and I should be redirected to the calendar view."
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Numbered list of steps that reliably trigger the bug.
      placeholder: |
        1. Go to Appointments
        2. Click 'New appointment'
        3. Fill in all fields
        4. Click 'Save'
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Which area of the application?
      options:
        - Dashboard / Overview
        - Appointments & Scheduling
        - Patients
        - Providers & Staff
        - Patient Portal / Self-booking
        - Google Calendar Sync
        - Analytics
        - Settings
        - Billing & Plans
        - AI / MCP API
        - Other
    validations:
      required: true

  - type: input
    id: browser
    attributes:
      label: Browser and OS
      placeholder: "Example: Chrome 124 on macOS 14"

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Screenshots, console errors, or anything else that might help.
