<link rel="icon" type="image/svg+xml" href="{{ '/assets/images/genko-logo.svg' | relative_url }}">
<link rel="apple-touch-icon" href="{{ '/assets/images/genko-logo.svg' | relative_url }}">
<meta name="theme-color" content="#2b60dd">

{% if page.redirect_to %}
{% assign redirect_url = page.redirect_to %}
<meta name="robots" content="noindex">
<meta http-equiv="refresh" content="0; url={{ redirect_url }}">
<link rel="canonical" href="{{ redirect_url }}">
<script>
(function() {
  var redirectUrl = {{ redirect_url | jsonify }};
  if (typeof window !== 'undefined' && window.location.href !== redirectUrl) {
    window.location.replace(redirectUrl);
  }
})();
</script>
{% endif %}
